name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  fhir-validate:
    # Official HL7 FHIR validator (R4 4.0.1) on the synthetic export. Fails on any error;
    # warnings are reported only. Results are documented in docs/FHIR_VALIDATION.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build synthetic export
        run: FHIR_OUT=$PWD/fhir-bundle.json npx vitest run src/lib/fhir.export.test.ts
      - name: Download HL7 validator
        run: curl -sSL -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/7.0.6/validator_cli.jar
      - name: Validate (R4 4.0.1)
        run: |
          java -jar validator_cli.jar -version | head -3 || true
          # tx.fhir.org (HL7's terminology server) is sometimes unreachable: one retry after 60 s. If both runs fail
          # the job fails; terminology checks are never switched off silently.
          for attempt in 1 2; do
            java -jar validator_cli.jar fhir-bundle.json -version 4.0.1 -output fhir-validation.json -html-output fhir-validation.html | tee fhir-validation.txt
            [ -s fhir-validation.json ] && break
            echo "Validator produced no result (attempt $attempt)"; sleep 60
          done
      - name: Summary
        if: always()
        run: |
          node scripts/fhir-summary.mjs fhir-validation.json --fail-on-error
          grep -E "Success|Error|errors" fhir-validation.txt | tail -5 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fhir-validation
          path: |
            fhir-bundle.json
            fhir-validation.json
            fhir-validation.html
            fhir-validation.txt
